<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - wePray</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 2rem;
            margin-top: 0;
            color: #ffffff;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 24px;
        }

        .email-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .email-btn:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>wePray Support</h1>
        <p>Have questions, feedback, or need assistance with <strong>wePray</strong>? We are here to help!</p>
        <a class="email-btn" href="mailto:adeelkunwar@gmail.com">Contact Support</a>
    </div>

    <footer>
        &copy; 2026 wePray. All rights reserved.
    </footer>
</div>

</body>
</html>
